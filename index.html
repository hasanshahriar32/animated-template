    const grid = document.getElementById('grid');
    const search = document.getElementById('search');
    const filterBtns = document.querySelectorAll('#filters .pill');

    let activeFilter = 'all';
    let searchQuery = '';

    function render() {
      const q = searchQuery.toLowerCase().trim();
      const filtered = items.filter(item => {
        const matchesCat = activeFilter === 'all' || item.category === activeFilter;
        const matchesQuery = !q ||
          item.title.toLowerCase().includes(q) ||
          item.desc.toLowerCase().includes(q) ||
          item.topics.some(t => t.toLowerCase().includes(q));
        return matchesCat && matchesQuery;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty">No templates matching your search.</div>';
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="card">
          <div class="card-img-wrap">
            ${item.preview ? `<img class="card-img" src="${item.preview}" alt="${item.title}" loading="lazy" />` : '<div class="no-img"><span>No Preview Available</span></div>'}
          </div>
          <div class="card-body">
            <div class="card-category">${item.category}</div>
            <h2 class="card-title">${item.title}</h2>
            <p class="card-desc" title="${item.desc}">${item.desc}</p>
            <div class="tags">
              ${item.topics.map(t => `<span class="tag">#${t}</span>`).join('')}
            </div>
            <div class="card-footer">
              ${item.has_demo ? `<a class="btn btn-demo" href="./${item.id}/index.html" target="_blank">Live Demo ↗</a>` : ''}
              <a class="btn btn-source" href="https://github.com/hasanshahriar32/animated-template/tree/main/${item.id}" target="_blank">Source</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    search.addEventListener('input', e => {
      searchQuery = e.target.value;
      render();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.cat;
        render();
      });
    });

    render();
  </script>
