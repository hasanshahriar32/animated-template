      --card-hover: #1e293b;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --tag-bg: #1e1b4b;
      --tag-text: #a5b4fc;
      --demo-bg: #10b981;
      --demo-hover: #059669;
      --copy-bg: #374151;
      --copy-hover: #4b5563;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {

      line-height: 1.5;
      padding: 2rem 1.5rem;
    }
    .container {
      max-width: 1300px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
      padding: 2.5rem 1.5rem;
      background: linear-gradient(180deg, rgba(99, 102, 241, 0.15) 0%, rgba(9, 13, 22, 0) 100%);
      border-radius: 1rem;
      border: 1px solid rgba(99, 102, 241, 0.2);
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #fff 30%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 700px;
      margin: 0 auto 1.5rem;
    }
    .badges {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #1f2937;
      color: #e5e7eb;
      font-size: 0.825rem;
      padding: 0.4rem 0.9rem;
      border-radius: 9999px;
      border: 1px solid #374151;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .badge:hover {
      border-color: #6b7280;
    }
    .badge.accent {
      background: rgba(99, 102, 241, 0.25);
      border-color: rgba(99, 102, 241, 0.5);
      color: #c7d2fe;
    }
    .badge.action-btn {
      background: #312e81;
      border-color: #4f46e5;
      color: #e0e7ff;
      font-weight: 600;
    }
    .badge.action-btn:hover {
      background: #4338ca;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    @media (min-width: 768px) {
      .controls {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }
    .search-input {
      flex: 1;
      max-width: 450px;
      padding: 0.75rem 1.25rem;
      border-radius: 0.75rem;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    .view-controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .pill {
      padding: 0.5rem 0.9rem;
      border-radius: 0.5rem;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .pill:hover {
      color: var(--text);
      background: var(--card-hover);
    }
    .pill.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.875rem;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: #374151;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .card-img-wrap {
      width: 100%;
      height: 190px;
      background: #0f172a;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--card-border);
      position: relative;
    }
    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      transition: transform 0.3s;
    }
    .card:hover .card-img {
      transform: scale(1.03);
    }
    .no-img {
      color: var(--text-muted);
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .card-category {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 0.4rem;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text);
    }
    .card-desc {
      color: var(--text-muted);
      font-size: 0.875rem;
      line-height: 1.45;
      margin-bottom: 1rem;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tags {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }
    .tag {
      background: var(--tag-bg);
      color: var(--tag-text);
      font-size: 0.725rem;
      padding: 0.2rem 0.55rem;
      border-radius: 0.35rem;
    }
    .card-footer {
      display: flex;
      gap: 0.5rem;
      margin-top: auto;
    }
    .btn {
      text-align: center;
      padding: 0.55rem 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-demo {
      flex: 1.2;
      background: var(--demo-bg);
      color: #fff;
    }
    .btn-demo:hover {
      background: var(--demo-hover);
    }
    .btn-copy {
      background: var(--copy-bg);
      color: #e5e7eb;
    }
    .btn-copy:hover {
      background: var(--copy-hover);
    }
    .btn-source {
      background: #1f2937;
      color: #e5e7eb;
      border: 1px solid #374151;
    }
    .btn-source:hover {
      background: #374151;
    }
    .table-container {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }
    th, td {
      padding: 0.9rem 1.2rem;
      border-bottom: 1px solid var(--card-border);
    }
    th {
      background: #1e293b;
      color: #f3f4f6;
      font-weight: 600;
    }
    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }
    .table-actions {
      display: flex;
      gap: 0.4rem;
    }
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #10b981;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 600;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 1000;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

    const grid = document.getElementById('grid');
    const tableContainer = document.getElementById('tableContainer');
    const tableBody = document.getElementById('tableBody');
    const search = document.getElementById('search');
    const filterBtns = document.querySelectorAll('#filters .pill');
    const viewToggle = document.getElementById('viewToggle');
    const toast = document.getElementById('toast');

    let activeFilter = 'all';
    let searchQuery = '';
    let isTableView = false;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function getAbsoluteUrl(folder) {
      const origin = window.location.origin;
      const pathname = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/+$/, '');
      return `${origin}${pathname}/${folder}/index.html`;
    }

    function copyLink(folder, e) {
      if (e) e.stopPropagation();
      const url = getAbsoluteUrl(folder);
      navigator.clipboard.writeText(url).then(() => {
        showToast(`Copied live demo link for ${folder}!`);
      });
    }

    function copyAllLinks() {
      const demoItems = items.filter(i => i.has_demo);
      const list = demoItems.map(i => `${i.title}: ${getAbsoluteUrl(i.id)}`).join('\n');
      navigator.clipboard.writeText(list).then(() => {
        showToast(`Copied all ${demoItems.length} demo links to clipboard!`);
      });
    }

    function toggleView() {
      isTableView = !isTableView;
      if (isTableView) {
        grid.style.display = 'none';
        tableContainer.style.display = 'block';
        viewToggle.textContent = 'Switch to Card Grid 🎴';
      } else {
        grid.style.display = 'grid';
        tableContainer.style.display = 'none';
        viewToggle.textContent = 'Switch to Table View 📑';
      }
      render();
    }

    function render() {
      const q = searchQuery.toLowerCase().trim();
      const filtered = items.filter(item => {
        const matchesCat = activeFilter === 'all' || item.category === activeFilter;
        const matchesQuery = !q ||
          item.title.toLowerCase().includes(q) ||
          item.desc.toLowerCase().includes(q) ||
          item.topics.some(t => t.toLowerCase().includes(q));
        return matchesCat && matchesQuery;
      });

      if (isTableView) {
        tableBody.innerHTML = filtered.map((item, idx) => `
          <tr>
            <td>${idx + 1}</td>
            <td><strong>${item.title}</strong></td>
            <td><span class="tag">${item.category}</span></td>
            <td style="max-width: 450px;">${item.desc}</td>
            <td>
              <div class="table-actions">
                ${item.has_demo ? `
                  <a class="btn btn-demo" href="./${item.id}/index.html" target="_blank">Demo</a>
                  <button class="btn btn-copy" onclick="copyLink('${item.id}', event)">📋</button>
                ` : ''}
                <a class="btn btn-source" href="${item.source_url}" target="_blank">Source</a>
              </div>
            </td>
          </tr>
        `).join('');
      } else {
        grid.innerHTML = filtered.map(item => `
          <div class="card">
            <div class="card-img-wrap">
              ${item.preview ? `<img class="card-img" src="${item.preview}" alt="${item.title}" loading="lazy" />` : '<div class="no-img"><span>No Preview Available</span></div>'}
            </div>
            <div class="card-body">
              <div class="card-category">${item.category}</div>
              <h2 class="card-title">${item.title}</h2>
              <p class="card-desc" title="${item.desc}">${item.desc}</p>
              <div class="tags">
                ${item.topics.map(t => `<span class="tag">#${t}</span>`).join('')}
              </div>
              <div class="card-footer">
                ${item.has_demo ? `
                  <a class="btn btn-demo" href="./${item.id}/index.html" target="_blank">Live Demo ↗</a>
                  <button class="btn btn-copy" title="Copy Direct URL" onclick="copyLink('${item.id}', event)">📋 Copy Link</button>
                ` : ''}
                <a class="btn btn-source" href="${item.source_url}" target="_blank">Source</a>
              </div>
            </div>
          </div>
        `).join('');
      }
    }

    search.addEventListener('input', e => {
      searchQuery = e.target.value;
      render();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.cat;
        render();
      });
    });

    render();
  </script>
</body>
